<script>
// === JOBSEEKER-GO ANTI-FAKE SYSTEM ===
window.JG_MODERATION = {
  // Config
  requireAuth: true,
  requireApproval: true,
  blockedKeywords: ["telegram", "whatsapp only", "pay to apply", "pay fee", "crypto investment", "upfront payment", "onlyfans", "adult"],
  trustedDomains: ["linkedin.com", "indeed.com", "company.com"], // add yours
  
  // Check job for spam/fake signals
  validateJob: function(job) {
    const text = (job.title + " " + job.description + " " + job.company).toLowerCase();
    const issues = [];
    
    // 1. Spam keywords
    for(let kw of this.blockedKeywords) {
      if(text.includes(kw)) issues.push(`Blocked phrase: ${kw}`);
    }
    
    // 2. Unrealistic salary (e.g. $500/hr for data entry)
    if(job.salary && job.salary.match(/\$\s*\d{3,}\/hr/)) {
      issues.push("Unrealistic salary");
    }
    
    // 3. No company website / email from gmail only
    if(job.companyEmail && job.companyEmail.endsWith("@gmail.com") && !job.companyWebsite) {
      issues.push("Unverified company email");
    }
    
    // 4. Too short description
    if(!job.description || job.description.length < 80) {
      issues.push("Description too short - add details");
    }
    
    return { valid: issues.length === 0, issues };
  }
};
console.log("Anti-fake moderation loaded");
</script>

<!-- RECRUITER-READY: REAL PROFILES + AUTH + NO CURSING - UI UNCHANGED -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBHYmBHHS9QHhM9c1Q4SCMMd3hR1tWKwrQ",
    authDomain: "jobseeker-go.firebaseapp.com",
    projectId: "jobseeker-go",
    storageBucket: "jobseeker-go.firebasestorage.app",
    messagingSenderId: "825084010299",
    appId: "1:825084010299:web:ab3140427354bfa6a0611e"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  window.db = firebase.firestore();
  window.auth = firebase.auth();

  const CURSE_WORDS = ['fuck','shit','bitch','asshole','dick','pussy','cunt','bastard','damn','crap','fuk','nigger','nigga','faggot','retard','kys','nazi','slut','whore','douche','cock','tits','fag','wtf','stfu','bullshit','motherfucker','mf'];
  function hasCurse(t){
    if(!t) return false;
    const l=t.toLowerCase();
    for(let w of CURSE_WORDS){
      const re = new RegExp('\\b'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
      if(w.length<=3){ if(re.test(l)) return w; } else if(l.includes(w)) return w;
    }
    return false;
  }

  // === CLOUD PROFILE SAVE - SAME UI ===
  let currentUser=null;
  window.auth.onAuthStateChanged(u=>{ currentUser=u; });

  function hookProfileSave(){
    // Find all inputs that look like profile creation - hook into localStorage set
    const origSet = localStorage.setItem;
    localStorage.setItem = function(k,v){
      origSet.call(this,k,v);
      if(k==='jg_posts' || k.includes('profile') || k.includes('jobseeker')){
        try{
          const data = JSON.parse(v);
          // If it looks like a profile, save to cloud if logged in
          if(data && (data.name || data.title || data.bio || Array.isArray(data))){
            if(currentUser){
              const bad = hasCurse(JSON.stringify(data));
              if(bad) { console.log('Profile blocked curse',bad); return; }
              window.db.collection('profiles').doc(currentUser.uid).set({
                data: data,
                email: currentUser.email,
                uid: currentUser.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                status: 'pending',
                approved: false,
                name: (data.name||data.title||'').substring(0,100)
              }, {merge:true}).catch(()=>{});
            }
          }
        }catch(e){}
      }
    };
  }

  // === AUTH UI - MATCHES YOUR DARK THEME, NO UI CHANGE ===
  function injectAuthButton(){
    if(document.getElementById('authBtnInject')) return;
    const header = document.querySelector('header') || document.querySelector('nav') || document.body;
    const existingProfileBtn = document.querySelector('button');
    if(!header) return;
    
    // Create tiny auth bar that matches your UI
    const bar = document.createElement('div');
    bar.id='authBtnInject';
    bar.style.cssText='position:fixed;top:56px;right:8px;z-index:9999;display:flex;gap:6px;align-items:center;';
    bar.innerHTML=`
      <div id="authStatus" style="font-size:10px;color:rgba(255,255,255,0.4);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
      <button id="loginBtn" style="height:28px;padding:0 12px;border-radius:9999px;background:white;color:black;font-size:11px;font-weight:700;border:none;cursor:pointer;">Log in / Sign up</button>
      <button id="logoutBtn" style="display:none;height:28px;padding:0 12px;border-radius:9999px;background:#121212;color:white;font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,0.1);cursor:pointer;">Log out</button>
    `;
    document.body.appendChild(bar);

    const modal = document.createElement('div');
    modal.id='authModal';
    modal.style.cssText='display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:10000;align-items:center;justify-content:center;backdrop-filter:blur(8px);';
    modal.innerHTML=`
      <div style="width:92%;max-width:360px;background:#121212;border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:20px;">
        <div style="font-size:16px;font-weight:800;color:white;margin-bottom:4px;">Make your profile real</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:16px;">Save to cloud • Log back in anywhere • Recruiters see real people</div>
        <input id="authEmail" placeholder="Email" style="width:100%;height:44px;background:#0A0A0A;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:0 14px;color:white;font-size:14px;margin-bottom:10px;outline:none;" />
        <input id="authPass" type="password" placeholder="Password (6+ chars)" style="width:100%;height:44px;background:#0A0A0A;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:0 14px;color:white;font-size:14px;margin-bottom:12px;outline:none;" />
        <div id="authErr" style="font-size:11px;color:#f87171;margin-bottom:10px;min-height:14px;"></div>
        <button id="authSubmit" style="width:100%;height:44px;background:white;color:black;border-radius:9999px;font-weight:700;font-size:14px;border:none;cursor:pointer;">Continue</button>
        <button id="authClose" style="width:100%;height:36px;background:transparent;color:rgba(255,255,255,0.5);font-size:12px;border:none;cursor:pointer;margin-top:8px;">Cancel</button>
        <div style="font-size:10px;color:rgba(255,255,255,0.3);text-align:center;margin-top:12px;">Secured by Google Firebase • No spam • No cursing</div>
      </div>
    `;
    document.body.appendChild(modal);

    function updateAuthUI(user){
      const status=document.getElementById('authStatus');
      const login=document.getElementById('loginBtn');
      const logout=document.getElementById('logoutBtn');
      if(user){
        if(status) status.textContent = user.email;
        if(login) { login.textContent='✓ Real Profile'; login.style.background='#00FF88'; login.style.color='black'; }
        if(logout) logout.style.display='block';
      } else {
        if(status) status.textContent='';
        if(login) { login.textContent='Log in / Sign up'; login.style.background='white'; login.style.color='black'; }
        if(logout) logout.style.display='none';
      }
    }

    window.auth.onAuthStateChanged(u=>{ currentUser=u; updateAuthUI(u); });

    document.getElementById('loginBtn').onclick=()=>{ document.getElementById('authModal').style.display='flex'; };
    document.getElementById('authClose').onclick=()=>{ document.getElementById('authModal').style.display='none'; };
    document.getElementById('logoutBtn').onclick=()=>{ window.auth.signOut(); };
    document.getElementById('authSubmit').onclick=async()=>{
      const email=document.getElementById('authEmail').value.trim();
      const pass=document.getElementById('authPass').value;
      const err=document.getElementById('authErr');
      if(!email||!pass){ err.textContent='Enter email + password'; return; }
      if(pass.length<6){ err.textContent='Password needs 6+ chars'; return; }
      err.textContent='...';
      try{
        await window.auth.signInWithEmailAndPassword(email,pass);
        document.getElementById('authModal').style.display='none';
        err.textContent='';
      }catch(e){
        if(e.code==='auth/user-not-found' || e.code==='auth/invalid-credential'){
          try{
            await window.auth.createUserWithEmailAndPassword(email,pass);
            document.getElementById('authModal').style.display='none';
            err.textContent='';
          }catch(e2){ err.textContent=e2.message; }
        } else { err.textContent=e.message; }
      }
    };
  }

  function blockPostsCursing(){
    const postArea = document.querySelector('textarea[placeholder^="Share something in #"]');
    if(!postArea) return;
    let parent = postArea.parentElement;
    for(let i=0;i<5;i++){
      if(!parent) break;
      const btns = parent.querySelectorAll('button');
      for(let btn of btns){
        if(btn.textContent && btn.textContent.trim().toLowerCase()==='post' && !btn.dataset.curseGuard){
          btn.dataset.curseGuard='1';
          let statusDiv = parent.querySelector('#postCurseStatus');
          if(!statusDiv){
            statusDiv = document.createElement('div');
            statusDiv.id='postCurseStatus';
            statusDiv.className='text-[11px] mt-2';
            statusDiv.style.color='rgba(255,255,255,0.5)';
            parent.appendChild(statusDiv);
          }
          btn.addEventListener('click', function(e){
            const val = postArea.value.trim();
            const bad = hasCurse(val);
            if(bad){
              e.preventDefault(); e.stopImmediatePropagation();
              statusDiv.textContent = `🚫 No cursing! Found "${bad}"`;
              statusDiv.style.color='#f87171';
              postArea.style.borderColor='#ef4444';
              setTimeout(()=>{ postArea.style.borderColor=''; }, 2000);
              return false;
            }
          }, true);
        }
      }
      parent = parent.parentElement;
    }
  }

  function injectFeedback(){
    if(document.getElementById('feedbackBoxFinal')) return;
    const composer = document.querySelector('textarea[placeholder^="Share something in #"]');
    if(!composer) return;
    const parent = composer.closest('.flex.flex-col.gap-4') || composer.parentElement.parentElement;
    if(!parent) return;
    const box = document.createElement('div');
    box.id = 'feedbackBoxFinal';
    box.className = 'rounded-[16px] bg-[#121212] border border-white/[0.08] p-[16px] mt-6';
    box.innerHTML = `
      <div class="text-[13px] font-bold text-white">hey guys please help me fix anything you find broken leave it here please!</div>
      <div class="text-[11px] text-white/50 mt-1 mb-3">Community Feedback — Everyone sees this</div>
      <textarea id="fbText" placeholder="What's broken? What needs fixing? Leave it here..." class="w-full min-h-[90px] bg-[#0A0A0A] border border-white/10 rounded-[12px] p-3 text-[13px] text-white placeholder:text-white/30 focus:outline-none focus:border-white/20 resize-none"></textarea>
      <div class="flex justify-between items-center mt-3"><div id="fbStatus" class="text-[11px] text-white/50">Ready</div><button id="fbSubmit" type="button" class="h-[36px] px-[18px] rounded-full bg-white text-black text-[12px] font-bold">Submit Feedback</button></div>
      <div class="mt-4 border-t border-white/5 pt-4"><div class="flex justify-between items-center mb-2"><div class="text-[11px] uppercase tracking-[0.12em] font-bold text-white/60">Live Feedbacks</div><div id="fbCount" class="text-[10px] text-white/30">0</div></div><div id="fbList" class="space-y-2 max-h-[400px] overflow-y-auto pr-1"><div class="text-[12px] text-white/30">Loading...</div></div></div>
    `;
    parent.appendChild(box);
    let localFeedbacks = JSON.parse(localStorage.getItem('jobseeker_feedbacks')||'[]');
    function renderList(arr){ const list=document.getElementById('fbList'); const c=document.getElementById('fbCount'); if(!list) return; if(!arr.length){ list.innerHTML='<div class="text-[12px] text-white/30 p-2">No feedbacks yet</div>'; if(c) c.textContent='0'; return; } if(c) c.textContent=arr.length; list.innerHTML = arr.map(f=>`<div class="p-3 rounded-[12px] bg-[#0A0A0A] border border-white/[0.06]"><div class="text-[13px] text-white/80">${(f.text||'').replace(/</g,'&lt;')}</div><div class="text-[10px] text-white/30 mt-2">${f.timeStr||'just now'}</div></div>`).join(''); }
    renderList(localFeedbacks);
    document.getElementById('fbSubmit').onclick = async ()=>{
      const t=document.getElementById('fbText'); const st=document.getElementById('fbStatus'); const v=t.value.trim();
      if(!v){ st.textContent='Write something first'; st.style.color='#f87171'; return; }
      const bw=hasCurse(v); if(bw){ st.textContent=`🚫 No cursing! Found "${bw}"`; st.style.color='#f87171'; t.style.borderColor='#ef4444'; setTimeout(()=>t.style.borderColor='',2000); return; }
      const nf={text:v, time:Date.now(), timeStr:new Date().toLocaleString()}; localFeedbacks.unshift(nf); localStorage.setItem('jobseeker_feedbacks', JSON.stringify(localFeedbacks.slice(0,100))); renderList(localFeedbacks); st.textContent='Saving...'; t.value='';
      try{ await window.db.collection('community_feedback').add({text:v, time:Date.now()}); st.textContent='✓ Saved!'; st.style.color='#00FF88'; }catch(e){ st.textContent='✓ Saved locally'; }
      setTimeout(()=>{ st.textContent='Ready'; st.style.color='rgba(255,255,255,0.5)'; }, 3000);
    };
    try{
      window.db.collection('community_feedback').limit(100).onSnapshot(snap=>{
        let cloud=[]; snap.forEach(doc=>{ const d=doc.data(); if(hasCurse(d.text||'')){ doc.ref.delete().catch(()=>{}); return; } cloud.push({text:d.text, time:d.time||0, timeStr: d.time? new Date(d.time).toLocaleString():'cloud'}); });
        cloud.sort((a,b)=>b.time-a.time);
        if(cloud.length>0){ let merged=[...cloud]; localFeedbacks.forEach(l=>{ if(!hasCurse(l.text) && !merged.some(m=>m.text===l.text)) merged.push(l); }); renderList(merged.slice(0,100)); }
      });
      window.db.collection('community_posts').onSnapshot(s=>{ s.docChanges().forEach(c=>{ if(c.type==='added' && hasCurse(c.doc.data().text||'')) c.doc.ref.delete().catch(()=>{}); }); });
    }catch(e){}
  }

  hookProfileSave();
  setInterval(()=>{ injectAuthButton(); blockPostsCursing(); injectFeedback(); }, 800);
</script>

<script>
// === GLOBAL POSTS SYNC FIX - makes posts visible to everyone ===
(function(){
  const COL = 'community_posts';
  let currentUserEmail = null;
  try { firebase.auth().onAuthStateChanged(u=>{ currentUserEmail = u ? u.email : null; }); } catch(e){}

  // Hook localStorage set for jg_posts to push new posts to cloud
  const origSet = localStorage.setItem.bind(localStorage);
  let lastPushedIds = new Set(JSON.parse(localStorage.getItem('jg_posts_pushed')||'[]'));
  
  localStorage.setItem = function(k,v){
    origSet(k,v);
    if(k==='jg_posts'){
      try{
        const arr = JSON.parse(v);
        if(!Array.isArray(arr)) return;
        // find new posts not yet pushed
        arr.forEach(p=>{
          if(!p || !p.id) return;
          if(lastPushedIds.has(String(p.id))) return;
          // push to firestore
          const docId = String(p.id);
          const cloudData = {
            id: p.id,
            handle: (p.handle||'anon').substring(0,30),
            avatarRole: p.avatarRole||'community',
            room: p.room||'general',
            text: (p.text||'').substring(0,280),
            createdAt: p.createdAt||Date.now(),
            likes: p.likes||0,
            email: currentUserEmail||'anon',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          };
          // curse check
          try {
            if(window.hasCurse && window.hasCurse(cloudData.text)) return;
          } catch(e){}
          window.db.collection(COL).doc(docId).set(cloudData, {merge:true}).then(()=>{
            lastPushedIds.add(String(p.id));
            origSet('jg_posts_pushed', JSON.stringify([...lastPushedIds].slice(-200)));
          }).catch(()=>{});
        });
      }catch(e){}
    }
  };

  // Cloud -> Local sync: listen to firestore and merge into localStorage + force UI refresh via custom renderer
  function timeAgo(ts){
    if(!ts) return 'just now';
    const d = typeof ts === 'number' ? ts : Date.now();
    const diff = Date.now() - d;
    if(diff<60000) return 'just now';
    if(diff<3600000) return Math.floor(diff/60000)+'m ago';
    if(diff<86400000) return Math.floor(diff/3600000)+'h ago';
    return Math.floor(diff/86400000)+'d ago';
  }

  function ensureGlobalContainer(){
    let el = document.getElementById('globalCloudPosts');
    if(el) return el;
    // find community board
    const board = document.querySelector('[class*="Community Board"]') || document.body;
    // find parent that contains posts
    const postArea = document.querySelector('textarea[placeholder^="Share something in #"]');
    if(!postArea) return null;
    let parent = postArea.closest('.flex.flex-col.gap-4') || postArea.parentElement.parentElement.parentElement;
    if(!parent) parent = document.body;
    el = document.createElement('div');
    el.id = 'globalCloudPosts';
    el.className = 'flex flex-col gap-3 mt-4';
    // Insert after the composer
    const composerCard = postArea.closest('.rounded-\[16px\]') || postArea.parentElement;
    if(composerCard && composerCard.parentElement){
      composerCard.parentElement.insertBefore(el, composerCard.nextSibling);
    } else {
      parent.appendChild(el);
    }
    return el;
  }

  function renderCloudPosts(posts){
    const container = ensureGlobalContainer();
    if(!container) return;
    // filter current room
    const roomEl = document.querySelector('button.bg-\[\#3B82F6\]'); // active room button
    let activeRoom = 'general';
    try {
      const activeBtn = document.querySelector('button.bg-\[\#3B82F6\].text-black');
      if(activeBtn) {
        const txt = activeBtn.textContent.replace('#','').trim().toLowerCase();
        if(txt) activeRoom = txt;
      }
    } catch(e){}
    // Try to get from URL or state
    const filtered = posts.filter(p=> (p.room||'general')===activeRoom);
    
    if(filtered.length===0){
      container.innerHTML = `<div class="py-8 flex flex-col items-center text-center rounded-[16px] bg-[#0A0A0A] border border-white/[0.06]"><div class="w-10 h-10 rounded-full bg-white/[0.04] border border-white/[0.06] flex items-center justify-center text-white/30 text-[16px] mb-2">∅</div><div class="text-[13px] text-white/60">No cloud posts in #${activeRoom} yet</div><div class="text-[11px] text-white/30 mt-1">Be first to post — everyone will see it</div></div>`;
      return;
    }
    
    container.innerHTML = filtered.slice(0,100).map(p=>{
      const roleColor = p.avatarRole==='jobseeker' ? 'bg-[#00FF88] text-black' : p.avatarRole==='recruiter' ? 'bg-[#FFC800] text-black' : 'bg-[#3B82F6] text-black';
      const safeText = (p.text||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const handle = (p.handle||'anon').replace(/</g,'&lt;');
      return `<div class="bg-[#0A0A0A] border border-white/[0.08] rounded-[16px] p-[14px] space-y-[8px]"><div class="flex items-center gap-2 flex-wrap"><div class="w-7 h-7 rounded-full flex items-center justify-center font-black text-[11px] shrink-0 ${roleColor}">${handle[0]?.toUpperCase()||'A'}</div><span class="text-[13px] font-semibold tracking-[-0.01em] text-white">@${handle}</span><span class="text-[10px] text-white/40">${timeAgo(p.createdAt)}</span><span class="text-[9px] px-1.5 py-0.5 rounded-full bg-[#00FF88]/10 border border-[#00FF88]/20 text-[#00FF88]">LIVE</span></div><div class="text-[13px] leading-[1.5] text-white/80 break-words">${safeText}</div></div>`;
    }).join('');
    
    // Also merge into localStorage so original list shows cloud posts too
    try{
      let local = JSON.parse(localStorage.getItem('jg_posts')||'[]');
      let changed = false;
      filtered.forEach(cp=>{
        if(!local.some(lp=> String(lp.id)===String(cp.id))){
          local.unshift(cp);
          changed = true;
        }
      });
      if(changed){
        // keep only 100
        local = local.slice(0,100);
        origSet('jg_posts', JSON.stringify(local));
        // trigger React to re-read? dispatch storage event
        window.dispatchEvent(new Event('storage'));
      }
    }catch(e){}
  }

  // Listen to firestore
  let cloudPosts = [];
  function startListener(){
    if(!window.db) { setTimeout(startListener, 1000); return; }
    window.db.collection(COL).orderBy('createdAt','desc').limit(100).onSnapshot(snap=>{
      cloudPosts = [];
      snap.forEach(doc=>{
        const d = doc.data();
        // curse filter
        try { if(window.hasCurse && window.hasCurse(d.text||'')) { doc.ref.delete(); return; } } catch(e){}
        cloudPosts.push(d);
      });
      renderCloudPosts(cloudPosts);
    }, err=>{
      console.log('cloud posts listen error', err);
    });
  }
  startListener();
  
  // Re-render on room change every 1s
  setInterval(()=>{ if(cloudPosts.length) renderCloudPosts(cloudPosts); }, 1500);
  
  console.log('GLOBAL POSTS SYNC FIX loaded - posts now visible to everyone');
})();
</script>
